<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>蓝盾翻译器 · 代理后台</title>
<style>
  /* ===== 蓝盾控制台 · 暗色(与主管理后台同一套设计语言)===== */
  :root {
    --bg:#0e1117; --bg-side:#0a0d13; --panel:#151a23; --panel-2:#1a212c; --input:#0f1420;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
    --txt:#e7ebf3; --txt-2:#9aa6ba; --txt-3:#68738a;
    --brand:#4f8dff; --brand-soft:rgba(79,141,255,.14);
    --green:#31c56a; --green-soft:rgba(49,197,106,.13);
    --amber:#f5a524; --amber-soft:rgba(245,165,36,.13);
    --red:#ef4d56;   --red-soft:rgba(239,77,86,.13);
    --purple:#9b7bff; --purple-soft:rgba(155,123,255,.15);
    --r:11px; --r-sm:7px;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family:'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
    background:var(--bg); color:var(--txt); font-size:13.5px; -webkit-font-smoothing:antialiased;
  }
  button { font-family:inherit; cursor:pointer; }
  .hidden { display:none !important; }

  /* 登录 */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1100px 560px at 50% -15%, #16233d, var(--bg)); }
  .login-card { width:380px; background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:34px 30px; box-shadow:0 24px 70px rgba(0,0,0,.5); }
  .brand-hero { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; }
  .brand-hero .logo { width:52px; height:52px; border-radius:14px; color:#fff; font-size:24px; font-weight:700;
    display:grid; place-items:center; background:linear-gradient(135deg,#3d84ff,#2f6bff); box-shadow:0 10px 26px rgba(61,132,255,.4); }
  .brand-hero h1 { font-size:19px; margin:0; letter-spacing:.5px; }
  .brand-hero p { margin:0; font-size:12px; color:var(--txt-3); }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; color:var(--txt-2); margin-bottom:6px; }
  .field input { width:100%; background:var(--input); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:11px 12px; font-size:14px; color:var(--txt); outline:none; transition:border-color .15s; }
  .field input:focus { border-color:var(--brand); }
  .btn-primary { width:100%; border:none; border-radius:var(--r-sm); padding:12px; background:var(--brand);
    color:#fff; font-size:15px; font-weight:600; margin-top:6px; transition:filter .15s, transform .1s; }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-primary:active { transform:scale(.99); }
  .btn-primary:disabled { opacity:.6; cursor:default; }

  /* 外壳 */
  .app { display:flex; min-height:100vh; }
  .sidebar { width:224px; flex:0 0 224px; background:var(--bg-side); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:18px 14px; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:11px; padding:6px 8px 18px; }
  .brand .logo { width:34px; height:34px; border-radius:9px; color:#fff; font-size:16px; font-weight:700;
    display:grid; place-items:center; background:linear-gradient(135deg,#3d84ff,#2f6bff); box-shadow:0 6px 16px rgba(61,132,255,.35); }
  .brand b { display:block; font-size:14px; line-height:1.2; }
  .brand span { display:block; font-size:11px; color:var(--txt-3); margin-top:2px; }
  .nav { display:flex; flex-direction:column; gap:3px; margin-top:4px; }
  .nav-item { display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:transparent; border:none;
    color:var(--txt-2); font-size:13.5px; padding:10px 12px; border-radius:var(--r-sm); position:relative; transition:background .12s, color .12s; }
  .nav-item .ico { font-size:15px; width:18px; text-align:center; opacity:.9; }
  .nav-item:hover { background:rgba(255,255,255,.04); color:var(--txt); }
  .nav-item.active { background:var(--brand-soft); color:#dbe7ff; font-weight:600; }
  .nav-item.active::before { content:""; position:absolute; left:-14px; top:9px; bottom:9px; width:3px; border-radius:0 3px 3px 0; background:var(--brand); }
  .side-foot { margin-top:auto; border-top:1px solid var(--line); padding-top:14px; }
  .side-user { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--txt-2); padding:0 8px 12px; word-break:break-all; }
  .side-user .dot { flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
  .side-logout { width:100%; background:transparent; border:1px solid var(--line-2); color:var(--txt-2); border-radius:var(--r-sm); padding:9px; font-size:13px; transition:.12s; }
  .side-logout:hover { border-color:var(--red); color:var(--red); background:var(--red-soft); }

  .content { flex:1; min-width:0; padding:26px 30px 60px; overflow-x:hidden; }
  .view-head { margin-bottom:20px; }
  .eyebrow { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--txt-3); margin-bottom:6px; }
  .view-head h1 { font-size:24px; font-weight:650; margin:0; letter-spacing:-.02em; }
  .view-head .desc { margin:7px 0 0; font-size:13px; color:var(--txt-2); }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); margin-bottom:18px; overflow:hidden; }
  .panel-head { display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .panel-title { font-size:14px; font-weight:600; display:flex; align-items:center; gap:9px; }
  .pill { font-size:11px; font-weight:500; color:#8fb4ff; background:var(--brand-soft); border-radius:20px; padding:3px 9px; }
  .panel-tools { margin-left:auto; display:flex; gap:9px; align-items:center; flex-wrap:wrap; }

  .search { background:var(--input); border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 12px;
    font-size:13px; color:var(--txt); width:210px; outline:none; transition:border-color .15s; }
  .search:focus { border-color:var(--brand); }
  .search::placeholder { color:var(--txt-3); }
  .btn-ghost { background:var(--panel-2); border:1px solid var(--line-2); color:var(--txt); border-radius:var(--r-sm); padding:8px 14px; font-size:13px; transition:.12s; }
  .btn-ghost:hover { border-color:var(--brand); color:#cfe0ff; background:var(--brand-soft); }

  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:13px 18px; font-size:13px; white-space:nowrap; }
  thead th { background:var(--panel-2); color:var(--txt-3); font-weight:600; font-size:11.5px; letter-spacing:.4px; border-bottom:1px solid var(--line); }
  tbody tr { border-bottom:1px solid var(--line); transition:background .1s; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:rgba(255,255,255,.025); }
  .email { font-weight:600; color:var(--txt); }
  .muted { color:var(--txt-3); font-variant-numeric:tabular-nums; }
  .note-tag { display:block; width:fit-content; margin-top:5px; max-width:240px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-size:11.5px; font-weight:500; color:#8fb4ff; background:var(--brand-soft);
    border:1px solid rgba(79,141,255,.28); border-radius:6px; padding:2px 8px; cursor:pointer; transition:.12s; }
  .note-tag::before { content:"备注 "; color:var(--txt-3); font-weight:400; }
  .note-tag:hover { border-color:var(--brand); color:#cfe0ff; }
  .state { text-align:center; color:var(--txt-3); padding:46px 0; font-size:13.5px; }

  .badge { display:inline-block; font-size:11px; padding:2px 9px; border-radius:6px; font-weight:600; }
  .badge-admin { color:#c3b0ff; background:var(--purple-soft); }
  .badge-user  { color:var(--txt-2); background:rgba(255,255,255,.06); }
  .badge-ok    { color:#4bd587; background:var(--green-soft); }
  .badge-banned{ color:#ff7078; background:var(--red-soft); }

  .row-actions { display:flex; gap:7px; justify-content:flex-end; }
  .act { background:var(--panel-2); border:1px solid var(--line); color:var(--txt-2); border-radius:6px; padding:5px 11px; font-size:12.5px; white-space:nowrap; transition:.12s; }
  .act:hover { border-color:var(--brand); color:#cfe0ff; background:var(--brand-soft); }
  .act.warn:hover  { border-color:var(--amber); color:var(--amber); background:var(--amber-soft); }
  .act.danger:hover{ border-color:var(--red); color:var(--red); background:var(--red-soft); }

  /* 弹窗 */
  .mask { position:fixed; inset:0; background:rgba(4,7,13,.66); backdrop-filter:blur(2px); display:grid; place-items:center; z-index:100; animation:fade .15s ease; }
  .modal { width:400px; max-width:calc(100vw - 32px); background:var(--panel); border:1px solid var(--line-2); border-radius:14px;
    padding:22px; box-shadow:0 30px 80px rgba(0,0,0,.6); animation:pop .18s cubic-bezier(.23,1,.32,1); }
  .modal h3 { margin:0 0 6px; font-size:16px; }
  .modal .sub { margin:0 0 16px; font-size:13px; color:var(--txt-2); line-height:1.6; }
  .modal .sub b { color:var(--txt); }
  .modal label { display:block; font-size:12px; color:var(--txt-2); margin:10px 0 6px; }
  .modal input { width:100%; background:var(--input); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px; font-size:14px; color:var(--txt); outline:none; }
  .modal input:focus { border-color:var(--brand); }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .modal-actions button { border:none; border-radius:var(--r-sm); padding:9px 18px; font-size:13px; transition:.12s; }
  .m-cancel { background:var(--panel-2); border:1px solid var(--line-2); color:var(--txt-2); }
  .m-cancel:hover { color:var(--txt); border-color:var(--txt-3); }
  .m-ok { background:var(--brand); color:#fff; }
  .m-ok:hover { filter:brightness(1.08); }
  .m-ok.danger { background:var(--red); }
  .m-ok:disabled { opacity:.6; cursor:default; }

  /* toast */
  .toast-viewport { position:fixed; right:20px; bottom:20px; z-index:3000; display:flex; flex-direction:column; align-items:flex-end; gap:10px; pointer-events:none; }
  .toast { pointer-events:auto; display:flex; align-items:center; gap:10px; min-width:200px; max-width:380px; padding:12px 16px; border-radius:10px;
    background:#1c2330; border:1px solid var(--line-2); color:var(--txt); font-size:13.5px; line-height:1.5; box-shadow:0 14px 36px rgba(0,0,0,.5); cursor:pointer; animation:toast-in .22s cubic-bezier(.22,1,.36,1); }
  .toast.leaving { animation:toast-out .2s ease forwards; }
  .toast-ico { flex:0 0 auto; width:20px; height:20px; border-radius:50%; color:#fff; display:grid; place-items:center; font-size:12px; font-weight:700; }
  .toast-success .toast-ico { background:var(--green); }
  .toast-error   .toast-ico { background:var(--red); }
  .toast-info    .toast-ico { background:var(--brand); font-style:italic; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  @keyframes pop { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:none} }
  @keyframes toast-in { from{opacity:0;transform:translateX(16px) translateY(6px);} to{opacity:1;transform:none;} }
  @keyframes toast-out { from{opacity:1;transform:none;} to{opacity:0;transform:translateX(16px);} }

  @media (max-width:760px) { .sidebar { display:none; } .content { padding:20px 16px 48px; } }
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="login-wrap">
  <form id="loginForm" class="login-card" autocomplete="off">
    <div class="brand-hero">
      <div class="logo">蓝</div>
      <h1>代理后台</h1>
      <p>蓝盾翻译器 · 用你的账号邮箱 + 密码登录</p>
    </div>
    <div class="field">
      <label>邮箱</label>
      <input id="loginEmail" type="email" placeholder="you@example.com" autofocus />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPassword" type="password" placeholder="登录密码" />
    </div>
    <button id="loginBtn" class="btn-primary" type="submit">登 录</button>
  </form>
</div>

<!-- 后台 -->
<div id="adminView" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">蓝</div>
      <div><b>蓝盾翻译器</b><span>代理后台</span></div>
    </div>
    <nav class="nav">
      <button id="navUsers" class="nav-item active"><span class="ico">👥</span>用户管理</button>
      <button id="navOrders" class="nav-item"><span class="ico">🧾</span>我的续费订单</button>
    </nav>
    <div class="side-foot">
      <div class="side-user"><span class="dot"></span><span id="whoEmail"></span></div>
      <button id="logoutBtn" class="side-logout">退出登录</button>
    </div>
  </aside>

  <main class="content">
    <!-- 用户管理 -->
    <section id="usersView" class="view">
      <div class="view-head">
        <div class="eyebrow">代理控制台</div>
        <h1>用户管理</h1>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">用户列表 <span id="countPill" class="pill">0 个用户</span></div>
          <div class="panel-tools">
            <input id="searchInput" class="search" type="text" placeholder="搜索邮箱 / 备注…" />
            <button id="refreshBtn" class="btn-ghost">刷新</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>邮箱</th>
                <th>状态</th>
                <th>会员到期(西雅图)</th>
                <th>注册时间</th>
                <th style="text-align:right;">操作</th>
              </tr>
            </thead>
            <tbody id="userRows"></tbody>
          </table>
          <div id="tableState" class="state">加载中…</div>
        </div>
      </div>
    </section>

    <!-- 我的续费订单 -->
    <section id="ordersView" class="view hidden">
      <div class="view-head">
        <div class="eyebrow">代理控制台</div>
        <h1>我的续费订单</h1>
        <p class="desc">你为用户生成的包月续费订单。把二维码截图发给用户,到账后系统自动发放会员时间。</p>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">订单列表 <span id="orderCountPill" class="pill">—</span></div>
          <div class="panel-tools">
            <span id="orderAutoHint" class="muted" style="font-size:12px;">● 自动检测到账中</span>
            <button id="orderRefreshBtn" class="btn-ghost">刷新</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>目标用户</th>
                <th>时长</th>
                <th>应付金额</th>
                <th>状态</th>
                <th>创建时间</th>
                <th style="text-align:right;">操作</th>
              </tr>
            </thead>
            <tbody id="orderRows"></tbody>
          </table>
          <div id="orderState" class="state">加载中…</div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastViewport" class="toast-viewport"></div>

<script>
// ============================================================
// 配置(可公开的 URL + publishable key,与主管理后台一致)。机密只在边缘函数里。
// ============================================================
const SUPABASE_URL = 'https://bicztczzmbudssstwuiv.supabase.co';
const PUBLISHABLE_KEY = 'sb_publishable_ckgXNQN98ZM_xw-KR0EzHw__HX_5HXg';
const FN_URL = SUPABASE_URL + '/functions/v1/admin';
const PAY_FN_URL = SUPABASE_URL + '/functions/v1/pay';
const TOKEN_URL = SUPABASE_URL + '/auth/v1/token?grant_type=password';

// 会话:持久化到 localStorage + 用 refresh_token 自动续期,避免「登录过期需要重新登录」。
const SESSION_KEY = 'bd_agent_session';
let accessToken = null;
let refreshToken = null;
let expiresAt = 0;         // access_token 到期的毫秒时间戳
let currentEmail = '';     // 当前登录邮箱(恢复会话时显示用)
let callerId = null;
let allUsers = [];
let serverNow = null;
let pricing = {};          // 本代理的包月价目表 { "天数": 价格 }
let payQrUrl = '';         // 未使用(代理不读收款设置);二维码由订单地址自动生成

// ---------------- toast ----------------
const ICONS = { success:'✓', error:'✕', info:'i' };
function toast(text, type = 'info') {
  const vp = document.getElementById('toastViewport');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  const ico = document.createElement('span'); ico.className = 'toast-ico'; ico.textContent = ICONS[type] || 'i';
  const txt = document.createElement('span'); txt.className = 'toast-text'; txt.textContent = text;
  el.append(ico, txt);
  const kill = () => { if (el.classList.contains('leaving')) return; el.classList.add('leaving'); setTimeout(() => el.remove(), 200); };
  el.addEventListener('click', kill);
  vp.appendChild(el);
  setTimeout(kill, 3500);
}

// ---------------- 会话复位 ----------------
function resetToLogin() {
  accessToken = null; refreshToken = null; expiresAt = 0; callerId = null; allUsers = []; pricing = {};
  clearSession();
  stopOrderPolling();
  document.getElementById('modalRoot').innerHTML = '';
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
}

// ---------------- 会话持久化 + 自动续期 ----------------
function saveSession() {
  try {
    if (accessToken && refreshToken) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        access_token: accessToken, refresh_token: refreshToken, expires_at: expiresAt, email: currentEmail,
      }));
    }
  } catch (_e) { /* localStorage 不可用则退化为内存会话 */ }
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (_e) { /* ignore */ }
}
// 把 token 响应写进会话状态(password / refresh_token 两种授权都用它)
function applyToken(data) {
  accessToken = data.access_token || null;
  if (data.refresh_token) refreshToken = data.refresh_token; // 刷新会轮换 refresh_token
  const ttl = Number(data.expires_in) || 3600;
  expiresAt = Date.now() + ttl * 1000;
  saveSession();
}
// 用 refresh_token 换新 access_token(并发合流,只发一次)。成功=true;失败=false。
let refreshing = null;
function refreshSession() {
  if (!refreshToken) return Promise.resolve(false);
  if (!refreshing) {
    refreshing = (async () => {
      try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': PUBLISHABLE_KEY },
          body: JSON.stringify({ refresh_token: refreshToken }),
        });
        if (!res.ok) return false;
        const data = await res.json();
        if (!data.access_token) return false;
        applyToken(data);
        return true;
      } catch (_e) { return false; }
    })().finally(() => { refreshing = null; });
  }
  return refreshing;
}
// 请求前确保 access_token 未过期(临期 60s 内先静默续期)
async function ensureFreshToken() {
  if (!accessToken) return false;
  if (Date.now() < expiresAt - 60000) return true;
  return await refreshSession();
}

// ---------------- fetch 封装 ----------------
async function readError(res) {
  try {
    const b = await res.json();
    return b.error || b.error_description || b.msg || b.message || ('请求失败 (' + res.status + ')');
  } catch { return '请求失败 (' + res.status + ')'; }
}
async function callAdmin(body) {
  await ensureFreshToken();
  const doFetch = () => fetch(FN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': PUBLISHABLE_KEY, 'Authorization': 'Bearer ' + accessToken },
    body: JSON.stringify(body),
  });
  let res = await doFetch();
  if (res.status === 401) {
    if (await refreshSession()) res = await doFetch();
    if (res.status === 401) {
      if (!document.getElementById('adminView').classList.contains('hidden')) resetToLogin();
      throw new Error('登录已失效,请重新登录');
    }
  }
  if (!res.ok) throw new Error(await readError(res));
  return res.json();
}
async function callPay(body) {
  await ensureFreshToken();
  const doFetch = () => fetch(PAY_FN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': PUBLISHABLE_KEY, 'Authorization': 'Bearer ' + accessToken },
    body: JSON.stringify(body),
  });
  let res = await doFetch();
  if (res.status === 401) {
    if (await refreshSession()) res = await doFetch();
    if (res.status === 401) {
      if (!document.getElementById('adminView').classList.contains('hidden')) resetToLogin();
      throw new Error('登录已失效,请重新登录');
    }
  }
  if (!res.ok) throw new Error(await readError(res));
  return res.json();
}

// ---------------- 登录 ----------------
async function doLogin(email, password) {
  const res = await fetch(TOKEN_URL, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': PUBLISHABLE_KEY },
    body: JSON.stringify({ email, password }),
  });
  if (!res.ok) {
    const msg = await readError(res);
    if (/invalid login credentials/i.test(msg)) throw new Error('邮箱或密码错误');
    if (/email not confirmed/i.test(msg)) throw new Error('邮箱尚未验证');
    throw new Error(msg);
  }
  return await res.json(); // 完整会话:access_token / refresh_token / expires_in
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d.getTime())) return '—';
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtSeattle(iso) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d.getTime())) return '—';
  try {
    return new Intl.DateTimeFormat('zh-CN', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
  } catch { return fmtDate(iso); }
}
function membershipView(u) {
  const exp = u.membership_expires_at;
  if (!exp) return { label: '未开通', cls: 'badge-user', exp: null };
  const expMs = new Date(exp).getTime();
  const nowMs = serverNow ? new Date(serverNow).getTime() : Date.now();
  if (isNaN(expMs)) return { label: '未开通', cls: 'badge-user', exp: null };
  if (expMs > nowMs) {
    const diff = expMs - nowMs;
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    return { label: '有效', cls: 'badge-ok', exp, remain: days + ' 天 ' + hours + ' 时' };
  }
  return { label: '已过期', cls: 'badge-banned', exp };
}

function paint() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const rows = document.getElementById('userRows');
  const stateEl = document.getElementById('tableState');
  rows.textContent = '';
  const list = q
    ? allUsers.filter(u => (u.email || '').toLowerCase().includes(q) || (u.note || '').toLowerCase().includes(q))
    : allUsers;
  document.getElementById('countPill').textContent = q ? (list.length + ' / ' + allUsers.length + ' 个用户') : (allUsers.length + ' 个用户');
  if (allUsers.length === 0) { stateEl.textContent = ''; stateEl.classList.add('hidden'); return; }
  if (list.length === 0) { stateEl.textContent = '没有匹配「' + q + '」的用户'; stateEl.classList.remove('hidden'); return; }
  stateEl.classList.add('hidden');
  for (const u of list) rows.appendChild(buildRow(u));
}

function buildRow(u) {
  const tr = document.createElement('tr');
  const tdEmail = document.createElement('td');
  const em = document.createElement('span'); em.className = 'email'; em.textContent = u.email || '(无邮箱)';
  tdEmail.appendChild(em);
  if (u.note) {
    const nt = document.createElement('div');
    nt.className = 'note-tag'; nt.textContent = u.note; nt.title = u.note + '(点击编辑备注)';
    nt.addEventListener('click', () => openNoteModal(u));
    tdEmail.appendChild(nt);
  }
  const tdStatus = document.createElement('td');
  tdStatus.appendChild(badge(u.is_banned ? '已封禁' : '正常', u.is_banned ? 'badge-banned' : 'badge-ok'));

  const tdMember = document.createElement('td');
  const mv = membershipView(u);
  tdMember.appendChild(badge(mv.label, mv.cls));
  if (mv.exp) {
    const d = document.createElement('div'); d.className = 'muted'; d.style.marginTop = '3px'; d.style.fontSize = '11px';
    d.textContent = (mv.remain ? '剩 ' + mv.remain + ' · ' : '') + fmtSeattle(mv.exp);
    tdMember.appendChild(d);
  }

  const tdCreated = document.createElement('td'); tdCreated.className = 'muted'; tdCreated.textContent = fmtDate(u.created_at);

  const tdAct = document.createElement('td');
  const wrap = document.createElement('div'); wrap.className = 'row-actions';
  wrap.appendChild(actionBtn('备注', '', () => openNoteModal(u)));
  wrap.appendChild(actionBtn('续费', '', () => openRenewModal(u)));
  wrap.appendChild(u.is_banned
    ? actionBtn('解封', '', () => confirmAction('unban', u))
    : actionBtn('封禁', 'warn', () => confirmAction('ban', u)));
  tdAct.appendChild(wrap);

  tr.append(tdEmail, tdStatus, tdMember, tdCreated, tdAct);
  return tr;
}

function badge(text, cls) { const s = document.createElement('span'); s.className = 'badge ' + cls; s.textContent = text; return s; }
function actionBtn(text, extra, onClick) { const b = document.createElement('button'); b.className = 'act' + (extra ? ' ' + extra : ''); b.textContent = text; b.addEventListener('click', onClick); return b; }
function bold(t){ const b=document.createElement('b'); b.textContent=t; return b; }
function label(t){ const l=document.createElement('label'); l.textContent=t; return l; }
function mbtn(t,cls){ const b=document.createElement('button'); b.className=cls; b.textContent=t; return b; }
function fmtNum(n){ return (Number(n) || 0).toLocaleString('en-US'); }
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function copyText(t){ navigator.clipboard.writeText(String(t)).then(() => toast('已复制','success'), () => toast('复制失败,请手动复制','error')); }

// 每 15s:触发服务端 scan 巡检到账 + 刷新(仅在订单页可见时)
function startOrderPolling() {
  stopOrderPolling();
  orderPollTimer = setInterval(async () => {
    if (!accessToken) { stopOrderPolling(); return; }
    try { await callPay({ action: 'scan', source: 'poll' }); } catch (_e) { /* 静默 */ }
    if (!document.getElementById('ordersView').classList.contains('hidden')) await loadOrders();
  }, 15000);
}
function stopOrderPolling() { if (orderPollTimer) { clearInterval(orderPollTimer); orderPollTimer = null; } }

// ---------------- 页面加载:若本机存有会话,静默续期并直接进入后台(免重新登录)----------------
(async function restoreSession() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (_e) { saved = null; }
  if (!saved || !saved.refresh_token) return;
  accessToken = saved.access_token || null;
  refreshToken = saved.refresh_token;
  expiresAt = Number(saved.expires_at) || 0;
  currentEmail = saved.email || '';
  await ensureFreshToken(); // 临期/已过期则先用 refresh_token 续期
  if (!accessToken) { clearSession(); return; }
  try {
    const data = await callAdmin({ action: 'list' });
    if (data.role !== 'subadmin') { resetToLogin(); return; }
    callerId = data.callerId; serverNow = data.server_now; pricing = data.pricing || {};
    onLoginSuccess(currentEmail, data.users);
  } catch (_e) { /* 恢复失败(refresh_token 已失效等):留在登录页 */ clearSession(); }
})();
</script>
